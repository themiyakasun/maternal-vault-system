version: '3.8'

services:
  maternal-vault-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maternal-vault-api
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=maternal_vault_secure_production_secret_2026
    volumes:
      # Persists SQLite tenant databases on host storage
      - ./data:/app/data
      - ./ml:/app/ml
