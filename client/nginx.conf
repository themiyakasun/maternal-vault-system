# HTTP Server: Auto-redirect all traffic on Port 80 and 8080 to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name research.themiyakasun.live _;

    # ACME challenge endpoint for Certbot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Lightweight healthcheck endpoint for Docker container
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy\n';
    }

    # Redirect all HTTP requests to secure HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server: Full SSL termination on Port 443
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name research.themiyakasun.live _;

    # SSL Certificates (Let's Encrypt / Fallback)
    ssl_certificate /etc/letsencrypt/live/research.themiyakasun.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/research.themiyakasun.live/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # Disable sendfile to avoid zero-byte transfers in Docker/VM overlayfs
    sendfile off;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Lightweight healthcheck endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy\n';
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets Cache (Vite generated hashed assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # SPA Routing: Fall back to index.html for React Router / client routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API Reverse Proxy with dynamic resolution
    location /api/ {
        set $backend "http://maternal-vault-backend:5000";
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /mobile/ {
        set $backend "http://maternal-vault-backend:5000";
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
