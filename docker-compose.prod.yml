version: '3.8'

services:
  maternal-vault-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: maternal-vault-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - STATION_MASTER_KEY=${STATION_MASTER_KEY:-MATERNA_VAULT_SECURE_PHM_MUM_71_SECRET_KEY}
      - OFFLINE_TOKEN_SECRET=${OFFLINE_TOKEN_SECRET:-MATERNA_VAULT_OFFLINE_STATION_HMAC_SECRET_9876}
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - ./data:/app/data
      - ./server/ml:/app/ml
    networks:
      - maternal-net

  maternal-vault-frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: maternal-vault-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - maternal-vault-backend
    networks:
      - maternal-net

networks:
  maternal-net:
    driver: bridge

volumes:
  maternal_data:
    driver: local
