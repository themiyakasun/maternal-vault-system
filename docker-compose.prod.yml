services:
  postgres:
    image: postgres:16-alpine
    container_name: maternal-vault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-maternal_vault}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-maternal_vault}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - maternal-net

  maternal-vault-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: maternal-vault-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - STATION_MASTER_KEY=${STATION_MASTER_KEY:-MATERNA_VAULT_SECURE_PHM_MUM_71_SECRET_KEY}
      - OFFLINE_TOKEN_SECRET=${OFFLINE_TOKEN_SECRET:-MATERNA_VAULT_OFFLINE_STATION_HMAC_SECRET_9876}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/maternal_vault}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./server/ml:/app/ml
    networks:
      - maternal-net

  maternal-vault-frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: maternal-vault-frontend
    restart: unless-stopped
    ports:
      - '80:80'
      - '8080:80'
      - '443:443'
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - maternal-vault-backend
    networks:
      - maternal-net

networks:
  maternal-net:
    driver: bridge

volumes:
  maternal_data:
    driver: local
  postgres_data:
    driver: local
